server.port=${PORT:8080}

# บังคับ UTF-8 ทุกชั้น — เนื้อหาเว็บเป็นภาษาไทยทั้งหมด
# ถ้าไม่ตั้ง เซิร์ฟเวอร์จะใช้ encoding ของเครื่องที่รัน (เช่น MS874 บน Windows ไทย)
# แล้วข้อความไทยที่ส่งออกไปจะกลายเป็น ????? ทั้งหน้า
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ฐานข้อมูล H2 แบบเก็บเป็นไฟล์ (ไม่หายตอนปิดโปรแกรม)
# โฟลเดอร์ ./data ถูก ignore ใน .gitignore แล้ว — ห้าม commit ข้อมูลผู้ใช้จริงขึ้น git
spring.datasource.url=jdbc:h2:file:./data/tiaoma;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway จัดการ schema — profile "postgres" เปิดใช้เอง (กันมันไปยุ่ง H2 ตอนรันธรรมดา)
spring.flyway.enabled=false

# H2 console ใช้ตอนพัฒนาเท่านั้น — ปิดอัตโนมัติเมื่อรันด้วย profile prod
# (ดู application-prod.properties.example)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# จำกัดขนาดไฟล์ที่อัปโหลด (รูปภาพของแอดมิน)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# โฟลเดอร์เก็บรูปที่แอดมินอัปโหลด – เสิร์ฟออกที่ /uploads/** (ดู WebConfig)[cite: 13, 15]
# อยู่นอก jar เพื่อให้ไฟล์ไม่หายตอน build ใหม่ และถูก ignore ใน .gitignore แล้ว[cite: 13, 15]
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-resize-width=${UPLOAD_MAX_WIDTH:1200}

# session cookie (ล็อกอินค้างไว้ 7 วัน)
# SameSite=Strict กัน CSRF ได้แน่นกว่า Lax เพราะ CSRF token ถูกปิดไว้ (ดู SecurityConfig)
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# ตั้ง COOKIE_SECURE=true เมื่อ deploy หลัง HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# บีบอัด response (ช่วยให้ JSON/CSS/JS โหลดเร็วขึ้น)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# cache ไฟล์ static (รูป/CSS/JS) ฝั่งเบราว์เซอร์ 7 วัน
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# ไม่เปิดเผยรายละเอียด error ให้ผู้ใช้ทั่วไป
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# อีเมล: ถ้ายังไม่ตั้ง spring.mail.host ระบบจะพิมพ์ลิงก์รีเซ็ตรหัสผ่านลง console แทน
# ตัวอย่าง (Gmail ต้องใช้ App Password):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:\u0E40\u0E17\u0E35\u0E48\u0E22\u0E27\u0E21\u0E30 <no-reply@tiaoma.local>}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# บัญชีแอดมินคนแรก — ระบบจะสร้าง/เลื่อนขั้นให้อัตโนมัติตอนเริ่มระบบ ถ้ายังไม่มีแอดมินคนไหนในระบบเลย
# *** สำคัญ: ตั้งค่าผ่าน environment variable APP_ADMIN_PASSWORD ก่อนขึ้นระบบจริงเสมอ ***
# ถ้าไม่ตั้ง ระบบจะสุ่มรหัสผ่านให้แล้วพิมพ์ลง console ครั้งเดียวตอนเริ่มระบบ
app.admin.name=${APP_ADMIN_NAME:\u0E1C\u0E39\u0E49\u0E14\u0E39\u0E41\u0E25\u0E23\u0E30\u0E1A\u0E1A}
app.admin.email=${APP_ADMIN_EMAIL:admin@tiaoma.local}
app.admin.password=${APP_ADMIN_PASSWORD:}

# จำกัดจำนวนครั้งที่เรียก API ที่อ่อนไหว (ป้องกันเดารหัสผ่าน / ยิงอีเมลถล่ม)
app.ratelimit.login.max-attempts=${RATELIMIT_LOGIN_MAX:8}
app.ratelimit.login.window-minutes=${RATELIMIT_LOGIN_WINDOW:15}
app.ratelimit.forgot.max-attempts=${RATELIMIT_FORGOT_MAX:4}
app.ratelimit.forgot.window-minutes=${RATELIMIT_FORGOT_WINDOW:60}
