# ตั้งค่าสำหรับรันเทสต์ — ใช้ฐานข้อมูลในหน่วยความจำ ไม่แตะไฟล์ข้อมูลจริงในโฟลเดอร์ data/
spring.datasource.url=jdbc:h2:mem:tiaoma-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# บัญชีแอดมินสำหรับเทสต์ (ค่าคงที่ เพื่อให้ผลการทดสอบคาดเดาได้)
app.admin.name=แอดมินทดสอบ
app.admin.email=admin@test.local
app.admin.password=testadmin123

app.public-base-url=http://localhost:8080
app.mail.from=ทดสอบ <test@tiaoma.local>

# ปิด rate limit ตอนเทสต์ เพื่อไม่ให้เทสต์ที่ยิงหลายครั้งติดลิมิต
app.ratelimit.login.max-attempts=1000
app.ratelimit.forgot.max-attempts=1000

# โฟลเดอร์อัปโหลดชั่วคราวของเทสต์
app.upload.dir=./target/test-uploads
