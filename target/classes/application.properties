server.port=8080

# ฐานข้อมูล H2 แบบเก็บเป็นไฟล์ (ไม่หายตอนปิดโปรแกรม)
spring.datasource.url=jdbc:h2:file:./data/tiaoma;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# H2 console ใช้ตอนพัฒนาเท่านั้น ควรปิด (false) ก่อนขึ้นระบบจริง
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# session cookie (ล็อกอินค้างไว้ 7 วัน) — ถ้าใช้ https จริง ให้เปิด secure=true
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# อีเมล: ถ้ายังไม่ตั้ง spring.mail.host ระบบจะพิมพ์ลิงก์รีเซ็ตรหัสผ่านลง console แทน
# ตัวอย่าง (Gmail ต้องใช้ App Password):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=เที่ยวมะ <no-reply@tiaoma.local>
app.public-base-url=http://localhost:8080

# บัญชีแอดมินคนแรก — ระบบจะสร้าง/เลื่อนขั้นให้อัตโนมัติตอนเริ่มระบบ ถ้ายังไม่มีแอดมินคนไหนในระบบเลย
# *** สำคัญ: เปลี่ยน app.admin.password ก่อนขึ้นระบบจริงเสมอ แล้วไปเปลี่ยนรหัสผ่านในระบบทันทีหลังล็อกอินครั้งแรก ***
app.admin.name=ผู้ดูแลระบบ
app.admin.email=admin@tiaoma.local
app.admin.password=123456789+a
