<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แนะนำที่เที่ยว | เที่ยวมะ</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ===== แถบค้นหา/กรอง (places.html) — ปรับใหม่ให้ดูมีมิติกว่า select ธรรมดา ===== */
  .tm-filterbar{
    display:flex; justify-content:center; align-items:stretch; gap:12px;
    flex-wrap:wrap; margin-bottom:34px;
  }
  .tm-search{
    position:relative; display:flex; align-items:center;
  }
  .tm-search::before{
    content:"🔍"; position:absolute; left:18px; font-size:14px; opacity:.55; pointer-events:none;
  }
  .tm-search input{
    padding:12px 20px 12px 42px; border:1.5px solid #e1ddd3; border-radius:999px;
    width:280px; font-size:14.5px; background:#fffdfa;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .tm-search input:focus{
    outline:none; border-color:#1a7a5e; box-shadow:0 0 0 3px rgba(26,122,94,.12);
  }
  .tm-pill{
    position:relative; display:flex; align-items:center;
    border:1.5px solid #e1ddd3; border-radius:999px; background:#fffdfa;
    padding:0 38px 0 16px; min-width:168px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .tm-pill:hover{ transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.06); }
  .tm-pill::before{
    font-size:15px; margin-right:9px; line-height:1;
  }
  .tm-pill--region::before{ content:"🗺️"; }
  .tm-pill--category::before{ content:"🏷️"; }
  .tm-pill::after{
    content:""; position:absolute; right:16px; top:50%; width:9px; height:9px;
    border-right:2px solid #9a9284; border-bottom:2px solid #9a9284;
    transform:translateY(-65%) rotate(45deg); pointer-events:none;
    transition:border-color .15s ease;
  }
  .tm-pill:focus-within{ border-color:#1a7a5e; box-shadow:0 0 0 3px rgba(26,122,94,.12); }
  .tm-pill:focus-within::after{ border-color:#1a7a5e; }
  .tm-pill--category:focus-within{ border-color:#c9871f; box-shadow:0 0 0 3px rgba(201,135,31,.14); }
  .tm-pill--category:focus-within::after{ border-color:#c9871f; }
  .tm-pill select{
    appearance:none; -webkit-appearance:none; border:none; background:none;
    padding:12px 4px; font-size:14.5px; color:#2b2b2b; width:100%;
    cursor:pointer;
  }
  .tm-pill select:focus{ outline:none; }
  @media (max-width:600px){
    .tm-search input{ width:100%; }
    .tm-filterbar{ width:100%; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">เที่ยว<span class="dot">มะ</span></a>
  <nav class="main-nav">
    <a href="index.html">หน้าแรก</a>
    <a href="places.html" class="active">แนะนำที่เที่ยว</a>
    <a href="articles.html">บทความ</a>
    <a href="about.html">เที่ยวกับเรา</a>
  </nav>
  <div class="header-right">
    <div class="header-search">
      <input type="text" id="headerSearchInput" placeholder="ค้นหาที่เที่ยว...">
      <button onclick="headerSearchAndGo()">🔍</button>
    </div>
    <span id="authArea">
      <a href="login.html"><button class="btn-primary">สมัครสมาชิก/เข้าสู่ระบบ</button></a>
    </span>
  </div>
</header>

<section class="hero" style="min-height:200px;">
  <h2 style="font-size:1.8rem;">แนะนำที่เที่ยวทั่วไทย</h2>
  <p>เลือกจุดหมายที่ใช่ แล้วออกเดินทางไปกับเที่ยวมะ</p>
</section>

<main>
  <div class="search-box tm-filterbar">
    <div class="tm-search">
      <input type="text" id="searchInput" placeholder="พิมพ์ชื่อสถานที่ที่ต้องการค้นหา...">
    </div>
    <div class="tm-pill tm-pill--region">
      <select id="regionFilter">
        <option value="">ทุกภาค</option>
        <option value="เหนือ">ภาคเหนือ</option>
        <option value="ตะวันออกเฉียงเหนือ">ภาคตะวันออกเฉียงเหนือ (อีสาน)</option>
        <option value="กลาง">ภาคกลาง</option>
        <option value="ตะวันออก">ภาคตะวันออก</option>
        <option value="ตะวันตก">ภาคตะวันตก</option>
        <option value="ใต้">ภาคใต้</option>
      </select>
    </div>
    <div class="tm-pill tm-pill--category">
      <select id="categoryFilter">
        <option value="">ทุกประเภท</option>
        <option value="ภูเขา">ภูเขา / ธรรมชาติ</option>
        <option value="ทะเล">ทะเล / เกาะ</option>
        <option value="วัด">วัด / วัฒนธรรม</option>
        <option value="ประวัติศาสตร์">ประวัติศาสตร์</option>
      </select>
    </div>
  </div>

  <section class="places-sections" id="places" data-mode="all">
    <!-- เนื้อหาสถานที่ท่องเที่ยวถูกสร้างขึ้นอัตโนมัติโดย script.js จาก places-data.js (แยกเป็นส่วนตามภาค) -->
  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-col">
      <h4>เที่ยวมะ</h4>
      <a href="about.html">เกี่ยวกับเรา</a>
      <a href="articles.html">บทความท่องเที่ยว</a>
    </div>
    <div class="footer-col">
      <h4>เมนู</h4>
      <a href="index.html">หน้าแรก</a>
      <a href="places.html">แนะนำที่เที่ยว</a>
    </div>
    <div class="footer-col">
      <h4>บัญชีผู้ใช้</h4>
      <a href="register.html">สมัครสมาชิก</a>
      <a href="login.html">เข้าสู่ระบบ</a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 เที่ยวมะ | เว็บไซต์แนะนำสถานที่ท่องเที่ยว</div>
</footer>

<button id="back-to-top" onclick="scrollToTop()">⬆</button>

<script src="places-data.js"></script>
<script src="script.js"></script>
</body>
</html>
